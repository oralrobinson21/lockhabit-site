<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>LockHabit — <span data-i18n="app_title">Income & Taxes</span></title>
  <meta name="description" content="Clean, fast income & tax calculator with animated breakdown. Auto country, auto currency, no sign-up."/>
  <meta name="theme-color" content="#0b1220"/>

  <style>
    :root{
      --bg:#0b1220; --panel:#0f1727; --line:#1a2740;
      --ink:#e7edf6; --muted:#a5b2c8; --accent:#45e0c7; --accent2:#67a8ff;
      --radius:16px; --shadow:0 10px 28px rgba(8,14,28,.35);
      --w:1120px;
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

    /* subtle animated header bg */
    header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg, rgba(7,13,28,.85), rgba(7,13,28,.55));border-bottom:1px solid rgba(26,39,64,.8);backdrop-filter:blur(8px)}
    .nav{max-width:var(--w);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
    .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800}
    .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,#45e0c7,#67a8ff)}
    .spacer{flex:1}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:#0e2036;border:1px solid #183154;color:#d5e6ff}

    main{max-width:var(--w);margin:0 auto;padding:18px 16px 36px}
    .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:stretch}
    @media (max-width:900px){ .hero{grid-template-columns:1fr} }

    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
    h1{margin:6px 0 4px;font-size:clamp(24px,3.8vw,36px);line-height:1.08}
    .muted{color:var(--muted)}

    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:620px){ .row{grid-template-columns:1fr} }
    label{font-weight:600;font-size:14px;color:#cfe3fb}
    input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #1b2e4c;background:#0e2036;color:#e7f0ff}
    .subgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

    .cta{display:flex;gap:10px;margin-top:10px}
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,#45e0c7,#67a8ff);color:#042b26;font-weight:800;cursor:pointer}

    .viz{display:grid;grid-template-columns:1fr;gap:12px}
    .viz canvas{width:100%;height:320px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02))}
    .legend{display:flex;gap:10px;flex-wrap:wrap}
    .tag{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid #203a5f;background:#10223a}
    .dot{width:10px;height:10px;border-radius:99px}

    .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:900px){ .cols{grid-template-columns:1fr} }
    .stat{background:#0e2036;border:1px solid #183154;border-radius:14px;padding:12px}
    .stat b{font-size:20px}

    .note{font-size:12px;color:#9fb2cf;margin-top:8px}
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="index.html"><span class="logo"></span>LockHabit</a>
      <div class="spacer"></div>
      <a class="pill" href="index.html" id="switchCalc"></a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <!-- Left: form -->
      <div class="panel">
        <h1 id="title"></h1>
        <p class="muted" id="sub"></p>

        <div class="controls" role="group">
          <div>
            <label id="lblCountry" for="countrySel"></label>
            <select id="countrySel" aria-label="Country">
              <option value="US">United States</option>
              <option value="GB">United Kingdom</option>
              <option value="AU">Australia</option>
              <option value="IN">India</option>
              <option value="CN">China</option>
            </select>
          </div>
          <div>
            <label id="lblCurrency" for="currencySel"></label>
            <select id="currencySel" aria-label="Currency">
              <option>USD</option><option>GBP</option><option>AUD</option>
              <option>INR</option><option>CNY</option>
            </select>
          </div>
          <div>
            <label for="cycleSel" id="lblCycle"></label>
            <select id="cycleSel">
              <option value="annual"></option>
              <option value="monthly"></option>
              <option value="biweekly"></option>
              <option value="weekly"></option>
            </select>
          </div>
        </div>

        <div class="row" style="margin-top:8px">
          <div>
            <label id="lblGross" for="gross"></label>
            <input id="gross" type="number" inputmode="decimal" min="0" value="80000"/>
          </div>
          <div>
            <label id="lblOther" for="other"></label>
            <input id="other" type="number" inputmode="decimal" min="0" value="0"/>
          </div>
        </div>

        <div class="subgrid" style="margin-top:8px">
          <div>
            <label id="lblFed" for="fed"></label>
            <input id="fed" type="number" inputmode="decimal" min="0" max="70" value="18"/>
          </div>
          <div>
            <label id="lblState" for="state"></label>
            <input id="state" type="number" inputmode="decimal" min="0" max="30" value="5"/>
          </div>
          <div>
            <label id="lblSocial" for="social"></label>
            <input id="social" type="number" inputmode="decimal" min="0" max="25" value="7.65"/>
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn" id="btnCalc"></button>
          </div>
        </div>
        <p class="note" id="note"></p>
      </div>

      <!-- Right: viz + stats -->
      <div class="panel viz">
        <canvas id="pie"></canvas>
        <div class="legend" id="legend"></div>
        <div class="cols">
          <div class="stat"><div id="statTake"></div><b id="valTake"></b></div>
          <div class="stat"><div id="statTax"></div><b id="valTax"></b></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="i18n.js"></script>
  <script src="charts.js"></script>
  <script>
    // ---- Minimal locale wiring
    function t(k){ return LHi18n.t(k); }

    // hydrate static labels
    document.getElementById("title").textContent = t("app_title");
    document.getElementById("sub").textContent = t("hero_sub");
    document.getElementById("switchCalc").textContent = "← " + t("switch_calc");
    document.getElementById("lblCountry").textContent = t("country");
    document.getElementById("lblCurrency").textContent = t("currency");
    document.getElementById("lblCycle").textContent = t("pay_cycle");
    document.querySelector('#cycleSel option[value="annual"]').textContent = t("annual");
    document.querySelector('#cycleSel option[value="monthly"]').textContent = t("monthly");
    document.querySelector('#cycleSel option[value="biweekly"]').textContent = t("biweekly");
    document.querySelector('#cycleSel option[value="weekly"]').textContent = t("weekly");
    document.getElementById("lblGross").textContent = t("gross_income");
    document.getElementById("lblOther").textContent = t("other_deductions");
    document.getElementById("lblFed").textContent = t("fed_tax") + " (%)";
    document.getElementById("lblState").textContent = t("state_tax") + " (%)";
    document.getElementById("lblSocial").textContent = t("social_tax") + " (%)";
    document.getElementById("btnCalc").textContent = t("calculate");
    document.getElementById("note").textContent = t("note_demo");
    document.getElementById("statTake").textContent = t("take_home");
    document.getElementById("statTax").textContent  = t("total_tax");

    // ---- Auto-select country/currency
    const countrySel = document.getElementById("countrySel");
    const currencySel = document.getElementById("currencySel");

    function autoCountry(){
      const saved = JSON.parse(localStorage.getItem("lh.country")||"null");
      if(saved && ["US","GB","AU","IN","CN"].includes(saved)) return saved;
      const lang = (navigator.language||"en-US").toUpperCase();
      const cc = lang.includes("-") ? lang.split("-")[1] : "US";
      return ["US","GB","AU","IN","CN"].includes(cc) ? cc : "US";
    }
    function syncCurrencyFromCountry(cc){
      const map = {US:"USD", GB:"GBP", AU:"AUD", IN:"INR", CN:"CNY"};
      const cur = map[cc] || "USD";
      currencySel.value = cur;
      localStorage.setItem("lh.currency", JSON.stringify(cur));
    }

    const cc = autoCountry();
    countrySel.value = cc;
    syncCurrencyFromCountry(cc);

    countrySel.addEventListener("change", ()=>{
      localStorage.setItem("lh.country", JSON.stringify(countrySel.value));
      syncCurrencyFromCountry(countrySel.value);
      // switch UI language
      location.reload();
    });
    currencySel.addEventListener("change", ()=>{
      localStorage.setItem("lh.currency", JSON.stringify(currencySel.value));
    });

    // ---- Calculator
    const gross     = document.getElementById("gross");
    const other     = document.getElementById("other");
    const fed       = document.getElementById("fed");
    const state     = document.getElementById("state");
    const social    = document.getElementById("social");
    const cycleSel  = document.getElementById("cycleSel");
    const valTake   = document.getElementById("valTake");
    const valTax    = document.getElementById("valTax");
    const legend    = document.getElementById("legend");
    const pieCanvas = document.getElementById("pie");
    let pie;

    function toAnnual(amount, cycle){
      const n = Number(amount)||0;
      switch(cycle){
        case "monthly": return n*12;
        case "biweekly": return n*26;
        case "weekly": return n*52;
        default: return n;
      }
    }

    function fmtMoney(n){
      const cur = JSON.parse(localStorage.getItem("lh.currency")||'"USD"');
      const code = cur==="Auto" ? "USD" : cur;
      try { return new Intl.NumberFormat(undefined,{style:"currency",currency:code,maximumFractionDigits:0}).format(n); }
      catch { return `$${Math.round(n)}`; }
    }

    function calc(){
      // Basic placeholder math (editable rates)
      const annualGross = toAnnual(gross.value, cycleSel.value);
      const taxFed   = annualGross * (Math.max(0, Number(fed.value))/100);
      const taxState = annualGross * (Math.max(0, Number(state.value))/100);
      const taxSoc   = annualGross * (Math.max(0, Number(social.value))/100);
      const otherD   = Math.max(0, Number(other.value));
      const totalTax = taxFed + taxState + taxSoc + otherD;
      const takeHome = Math.max(0, annualGross - totalTax);

      // Update numbers
      valTake.textContent = fmtMoney(takeHome);
      valTax.textContent  = fmtMoney(totalTax);

      // Update legend
      const items = [
        { key:"federal", color:"#63b3ff", value:taxFed },
        { key:"state",   color:"#9f9fff", value:taxState },
        { key:"social",  color:"#5ee0c8", value:taxSoc },
        { key:"other",   color:"#ffd27a", value:otherD },
      ];
      legend.innerHTML = "";
      items.forEach(it=>{
        const el = document.createElement("div");
        el.className = "tag";
        el.innerHTML = `<span class="dot" style="background:${it.color}"></span>${t(it.key)} — <b style="margin-left:6px">${fmtMoney(it.value)}</b>`;
        legend.appendChild(el);
      });

      // Draw chart
      const dataset = buildTaxDataset({
        federal: taxFed, state: taxState, social: taxSoc, other: otherD
      });
      pie = new PieChart(pieCanvas, dataset, { animate:true });
    }

    document.getElementById("btnCalc").addEventListener("click", calc);
    // initial run
    calc();
  </script>

  <!-- (Optional) Google tags — paste your GA/Adsense below if needed -->
</body>
</html>
